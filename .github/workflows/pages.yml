name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race; queue instead of cancelling, so a
# finished deploy is not thrown away half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The game is plain files — no build step, nothing to bundle. supabase-js
      # is vendored, so the page has no third-party runtime dependencies. Only
      # the playable files ship; the schema and docs stay in the repo.
      #
      # data/<lang>/valid-*.json (the broad dictionaries behind the
      # client-side "is this a real word" UX check) ship; the answers-*.json
      # beside them do NOT — those are the exact secret pools wf_next_round
      # draws from server-side, and publishing them would let anyone read
      # every possible answer in devtools, defeating the point of locking
      # wf_words behind RLS.
      #
      # Copied file-by-file rather than `cp -r data`, so a new answer list
      # cannot get published by merely existing, and the find below fails the
      # build rather than shipping one quietly if that ever slips.
      - name: Stage the site
        run: |
          cp -r index.html css js vendor _site/
          for lang in en it de es fr; do
            mkdir -p "_site/data/$lang"
            cp "data/$lang"/valid-*.json "_site/data/$lang/"
          done
          if find _site -name 'answers-*.json' | grep -q .; then
            echo "::error::answer lists were staged for deployment"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
